name: Publish static site to GitHub Pages

# Builds the app, generates the static read-only copy and publishes it at
# https://<owner>.github.io/<repo>/ . Runs on every push to the deployed
# branch and can be started by hand from the Actions tab.
on:
  push:
    branches: [claude/public-record-site, main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run data:validate
      - run: npm run build
      - run: node scripts/build-static-snapshot.mjs --serve --out out-static
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out-static

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
