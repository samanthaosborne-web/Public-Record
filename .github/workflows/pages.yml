name: Publish static site to GitHub Pages

# Builds the app, generates the static read-only copy and pushes it to the
# gh-pages branch, which GitHub Pages serves at https://<owner>.github.io/<repo>/
# (Settings → Pages → Source: "Deploy from a branch", branch gh-pages).
# Runs on every push to the deployed branch and can be started by hand. Before
# building it applies any editorial decisions written into review/REVIEW.md and
# commits the resulting data changes back to the branch.
on:
  push:
    branches: [claude/public-record-site, main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply editorial review decisions from review/REVIEW.md
        run: node scripts/apply-review.cjs
      - name: Commit applied decisions back to the branch
        run: |
          if [ -n "$(git status --porcelain -- src/data review)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/data review
            git commit -m "Apply editorial review decisions [skip ci]"
            git push
          fi
      - run: npm ci
      - run: npm run data:validate
      - run: npm run build
      - run: node scripts/build-static-snapshot.mjs --serve --out out-static
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out-static
          publish_branch: gh-pages
          force_orphan: true
